    <body>
        <script>
            function sendNuiMessage(event, data) {
                $.post(`https://${GetParentResourceName()}/${event}`, JSON.stringify({data}))
            }
            function onCloseButton() {
                sendNuiMessage('onCloseButton')
            }
            function onSaveButton() {
                sendNuiMessage('onSaveButton')
            }
            function onResetButton() {
                sendNuiMessage('onResetButton')
            }
            function onClear() {
                sendNuiMessage('onClearButton')
                window.drawer.api.loadCanvasFromData({})
            }
    
            window.alert = console.log
        </script>
    
        <div id="editor-wrapper" class="size-container" style="display:none;">
            <div id="canvas-editor" style="position: absolute; left: 500px; top: 500px;"></div>

            <div id="editor-control-buttons" class="buttons">
                <div class="editor-control-buttons--horizontal">

                        Cancel
                    </button>
                    <button onclick='onSaveButton()' class="button save-button">
                        <svg style="margin-right: 5px" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#FFFFFF" viewBox="0 0 256 256"><path d="M219.31,72,184,36.69A15.86,15.86,0,0,0,172.69,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V83.31A15.86,15.86,0,0,0,219.31,72ZM168,208H88V152h80Zm40,0H184V152a16,16,0,0,0-16-16H88a16,16,0,0,0-16,16v56H48V48H172.69L208,83.31ZM160,72a8,8,0,0,1-8,8H96a8,8,0,0,1,0-16h56A8,8,0,0,1,160,72Z"></path></svg>
                        Save
                    </button>
                </div>
                <div class="editor-control-buttons--vertical">
                    <button onclick='onResetButton()' class="button load-button">
                        <svg style="margin-bottom: 5px;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#FFFFFF" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216ZM115.58,84.84a8,8,0,0,0-8.38.76l-48,36a8,8,0,0,0,0,12.8l48,36A8,8,0,0,0,112,172a8,8,0,0,0,8-8V92A8,8,0,0,0,115.58,84.84ZM104,148,77.33,128,104,108Zm75.58-63.16a8,8,0,0,0-8.38.76l-48,36a8,8,0,0,0,0,12.8l48,36A8,8,0,0,0,176,172a8,8,0,0,0,8-8V92A8,8,0,0,0,179.58,84.84ZM168,148l-26.67-20L168,108Z"></path></svg>
                        Reset
                    </button>
                    <button onclick='onClear()' class="button clear-button">
                        <svg style="margin-bottom: 5px;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#FFFFFF" viewBox="0 0 256 256"><path d="M235.5,216.81c-22.56-11-35.5-34.58-35.5-64.8V134.73a15.94,15.94,0,0,0-10.09-14.87L165,110a8,8,0,0,1-4.48-10.34l21.32-53a28,28,0,0,0-16.1-37,28.14,28.14,0,0,0-35.82,16,.61.61,0,0,0,0,.12L108.9,79a8,8,0,0,1-10.37,4.49L73.11,73.14A15.89,15.89,0,0,0,55.74,76.8C34.68,98.45,24,123.75,24,152a111.45,111.45,0,0,0,31.18,77.53A8,8,0,0,0,61,232H232a8,8,0,0,0,3.5-15.19ZM67.14,88l25.41,10.3a24,24,0,0,0,31.23-13.45l21-53c2.56-6.11,9.47-9.27,15.43-7a12,12,0,0,1,6.88,15.92L145.69,93.76a24,24,0,0,0,13.43,31.14L184,134.73V152c0,.33,0,.66,0,1L55.77,101.71A108.84,108.84,0,0,1,67.14,88Zm48,128a87.53,87.53,0,0,1-24.34-42,8,8,0,0,0-15.49,4,105.16,105.16,0,0,0,18.36,38H64.44A95.54,95.54,0,0,1,40,152a85.9,85.9,0,0,1,7.73-36.29l137.8,55.12c3,18,10.56,33.48,21.89,45.16Z"></path></svg>

            <div id="rcore_whiteboard_editor_bg" class="rcore_whiteboard_editor_bg">
                <img src="./rcore_whiteboard_editor_bg.png" id="rcore_whiteboard_editor_bg_image" width="2042px" />
            </div>

        <div id="rcore_placer" style="display: none;">
            <div id="rcore_placer_controls"></div>
            <div id="rcore_placer_scene"></div>
        </div>
        
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

        <script type="module" src="rcore_placer/placer.js"></script>
        <script>
            function repositionButtons() {
                const rect = document.querySelector('#redactor-drawer-box .canvas-container').getBoundingClientRect()
                document.getElementById('editor-control-buttons').style.left = `${rect.right}px`
                document.getElementById('editor-control-buttons').style.top = `${rect.bottom}px`

                const clientWidth = document.body.clientWidth
                const getOffsets = () => {
                    if (clientWidth > 2000) {
                        return {
                            left: 40,
                            top: 49,
                            width: 122,
                        }
                    }
                    if (clientWidth > 1500) {
                        return {
                            left: 25,
                            top: 32,
                            width: 78,
                        }
                    }
                    return {
                        left: 20,
                        top: 25,
                        width: 60,
                    }
                }
                const offsetsByViewport = getOffsets()

                document.getElementById('rcore_whiteboard_editor_bg').style.left = `${rect.left - offsetsByViewport.left}px`
                document.getElementById('rcore_whiteboard_editor_bg').style.top = `${rect.top - offsetsByViewport.top}px`
                document.getElementById('rcore_whiteboard_editor_bg_image').style.width = `${rect.width + offsetsByViewport.width}px`
            }
        $(document).ready(function () {
            var drawerPlugins = [
                // Drawing tools
                'Pencil',
                'Eraser',
                'Text',
                'Line',
                'ArrowOneSide',
                'ArrowTwoSide',
                'Triangle',
                'Rectangle',
                'Circle',
                'Image',
                'BackgroundImage',
                'Polygon',
                'ImageCrop',

                // Drawing options
                //'ColorHtml5',
                'Color',
                'ShapeBorder',
                'BrushSize',
                'OpacityOption',

                'LineWidth',
                'StrokeWidth',

                // 'Resize',
                'ShapeContextMenu',
                // 'CloseButton',
                'OvercanvasPopup',
                'OpenPopupButton',
                // 'MinimizeButton',
                'ToggleVisibilityButton',
                // 'MovableFloatingMode',
                // 'FullscreenModeButton',

                'TextLineHeight',
                'TextAlign',

                'TextFontFamily',
                'TextFontSize',
                'TextFontWeight',
                'TextFontStyle',
                'TextDecoration',
                'TextColor',
                'TextBackgroundColor'
            ];

            // drawer is created as global property solely for debug purposes.
            // doing  in production is considered as bad practice
            window.drawer = null
            function createDrawer(size) {
                window.drawer = new DrawerJs.Drawer(null, {
                    exitOnOutsideClick: false,
                    plugins: drawerPlugins,
                    corePlugins: [
                        'Zoom' // use null here if you want to disable Zoom completely
                    ],
                    pluginsConfig: {
                        Image: {
                            scaleDownLargeImage: true,
                            maxImageSizeKb: 10240, //1MB
                            cropIsActive: true
                        },
                        BackgroundImage: {
                            scaleDownLargeImage: true,
                            maxImageSizeKb: 10240, //1MB
                            //fixedBackgroundUrl: '/examples/redactor/images/vanGogh.jpg',
                            imagePosition: 'center',  // one of  'center', 'stretch', 'top-left', 'top-right', 'bottom-left', 'bottom-right'
                            acceptedMIMETypes: ['image/jpeg', 'image/png', 'image/gif'] ,
                            dynamicRepositionImage: true,
                            dynamicRepositionImageThrottle: 100,
                            cropIsActive: false
                        },
                        Text: {
                            editIconMode : false,
                            editIconSize : 'large',
                            defaultValues : {
                            fontSize: 72,
                            lineHeight: 2,
                            textFontWeight: 'bold'
                            },
                            predefined: {
                            fontSize: [8, 12, 14, 16, 32, 40, 72],
                            lineHeight: [1, 2, 3, 4, 6]
                            }
                        },
                        Zoom: {
                            enabled: true, 
                            showZoomTooltip: true, 
                            useWheelEvents: true,
                            zoomStep: 1.05, 
                            defaultZoom: 1, 
                            maxZoom: 32,
                            minZoom: 1, 
                            smoothnessOfWheel: 0,
                            //Moving:
                            enableMove: true,
                            enableWhenNoActiveTool: true,
                            enableButton: true
                        }
                    },
                    toolbars: {
                        drawingTools: {
                            position: 'top',         
                            positionType: 'outside',
                            customAnchorSelector: '#custom-toolbar-here',  
                            hidden: false,     
                            toggleVisibilityButton: false,
                            fullscreenMode: {
                                position: 'top', 
                                hidden: false,
                                toggleVisibilityButton: false
                            }
                        },
                        toolOptions: {
                            position: 'bottom', 
                            positionType: 'outside',
                            hidden: false,
                            toggleVisibilityButton: false,
                            fullscreenMode: {
                                position: 'bottom', 
                                compactType: 'popup',
                                hidden: false,
                                toggleVisibilityButton: false
                            }
                        },
                        settings : {
                            position : 'right', 
                            positionType: 'outside',					
                            hidden: false,	
                            toggleVisibilityButton: false,
                            fullscreenMode: {
                                position : 'right', 
                                hidden: false,
                                toggleVisibilityButton: false
                            }
                        }
                    },
                    defaultImageUrl: '/examples/redactor/images/drawer.jpg',
                    defaultActivePlugin : { name : 'Pencil', mode : 'lastUsed', name: 'TextBackgroundColor', name: 'TextSize', name: 'TextFontSize', name: 'TextFontFamily'},
                    debug: false,
                    activeColor: '#f39b1b',
                    transparentBackground: false,
                    align: 'floating',  //one of 'left', 'right', 'center', 'inline', 'floating'
                    lineAngleTooltip: { enabled: true, color: 'blue',  fontSize: 15}
                }, size.width, size.height);

                $('#canvas-editor').append(window.drawer.getHtml());
                window.drawer.onInsert();
            }
            
            function onStartEditing(size) {
                createDrawer(size)
                window.drawer.api.startEditing()
            }

            function onStopEditing() {
                window.drawer.api.stopEditing()
                window.drawer.destroy()
            }
            function onLoad(data) {
                window.drawer.api.loadCanvasFromData(data)
            }
            function sendDrawingToDiscord({url, player, boardId}) {
                function sanitize(input) {
                    const element = document.createElement('div');
                    if (input) {
                        element.innerText = input;
                        return element.innerHTML;
                    }
                    return '';
                }
                
                const pngData = document.querySelector('.lower-canvas').toDataURL('image/webp', 0.7)
                if (!pngData.startsWith('data:image/webp;base64,')) {
                    return;
                }

                const formData = new FormData();

                const byteCharacters = atob(pngData.split(',')[1]);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += 1024) {
                    const slice = byteCharacters.slice(offset, offset + 1024);
                    const byteArray = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                    byteArray[i] = slice.charCodeAt(i);
                    }
                    byteArrays.push(byteArray);
                }

                const blob = new Blob(byteArrays, { type: 'image/webp' });

                formData.append('file', blob, 'drawing.webp');

                formData.append('content', `Player: ${sanitize(player)} \nBoard ID: ${sanitize(boardId)}`)

                fetch(url, {
                    method: 'POST',
                    body: formData
                })
            }
            function getCanvasAsJSON() {
                return window.drawer.api.getCanvasAsJSON()
            }

            function openEditor(size) {
                document.getElementById('editor-wrapper').style.display = 'block'
                onStartEditing(size)
                repositionButtons()
            }

            function closeEditor() {
                onStopEditing()
                document.getElementById('editor-wrapper').style.display = 'none'
            }

            function saveEditor() {
                sendNuiMessage('onEditorSave', getCanvasAsJSON())
            }
            function tempSaveEditor() {
                sendNuiMessage('onEditorTempSave', getCanvasAsJSON())
            }
            
            window.addEventListener('message', function(event) {
                const {action, data} = event.data
                
                if (action === 'OPEN_EDITOR') {
                    openEditor(data.size)

                    if (data.initialData) {
                        onLoad(data.initialData)
                    }
                }

                if (action === 'CLOSE_EDITOR') {
                    if (data.shouldSave) {
                        saveEditor()
                    }
                    closeEditor()
                }

                if (action === 'LOAD_DATA') {
                    onLoad(action.data)
                }

                if (action === 'SAVE_DATA') {
                    if (data) {
                        sendDrawingToDiscord(data)
                    }
                    saveEditor()
                }
                if (action === 'TEMP_SAVE_DATA') {
                    tempSaveEditor()
                }
            });
        });
    </script>
    </body>
</html>
